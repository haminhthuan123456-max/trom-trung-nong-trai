<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thuận Cafe POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: thanh đầu (thương hiệu, ca làm, nhân viên) + thanh tab + vùng làm việc dạng bảng/biểu mẫu + thanh trạng thái. Tông nâu espresso trên nền kem giấy hóa đơn. */
:root {
  --bg: #f4ece1;
  --panel: #fffaf3;
  --panel-2: #f8f0e4;
  --ink: #2a1a10;
  --muted: #7a6656;
  --line: #e3d3bf;
  --brand: #4a2e1b;
  --brand-2: #6b4429;
  --accent: #c4742a;
  --accent-soft: #f6e2cc;
  --on-dark: #fff8ee;
  --good: #2f7d4f;
  --good-soft: #e2f1e7;
  --warn: #b7791f;
  --warn-soft: #fbefd6;
  --bad: #b93a2e;
  --bad-soft: #f8e1dd;
  --info: #2f6db5;
  --info-soft: #e1ecf8;
  --c1: #c4742a; --c2: #6b4429; --c3: #d9a86c; --c4: #a8927f;
  --f-display: 'Lora', Georgia, 'Times New Roman', serif;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 10px;
  color-scheme: light;
}
html[data-ui="dark"] {
  --bg: #16100b; --panel: #211811; --panel-2: #2b2018; --ink: #f3e7d8; --muted: #b39d89; --line: #3e2f23;
  --brand: #3b2416; --brand-2: #8a5a34; --accent: #db8c3f; --accent-soft: #3b2919; --on-dark: #fff3e4;
  --good: #63c08a; --good-soft: #1d3326; --warn: #e3a843; --warn-soft: #3a2f17; --bad: #ee7062; --bad-soft: #3e201b; --info: #73abe9; --info-soft: #1b2a3d;
  --c2: #b07a4c; --c4: #7d6a5a;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.2; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- login ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(1200px 600px at 20% 10%, #5a3820 0%, #2a1a10 70%); }
.login { width: min(100%, 880px); display: grid; grid-template-columns: 1.05fr 1fr; background: var(--panel); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.login-art { background: linear-gradient(160deg, #3b2414, #1f130b); color: var(--on-dark); padding: 36px 32px; display: flex; flex-direction: column; gap: 18px; justify-content: space-between; min-width: 0; }
.login-art h1 { font-size: 38px; letter-spacing: .04em; color: #f0c48e; }
.login-art .slogan { font-family: var(--f-display); font-style: italic; opacity: .85; }
.login-art blockquote { margin: 0; font-family: var(--f-display); font-style: italic; font-size: 16px; opacity: .9; }
.cup { width: 100%; max-width: 260px; align-self: center; }
.login-feats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.login-form { padding: 36px 32px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.login-form h2 { font-size: 30px; color: var(--brand); text-align: center; letter-spacing: .06em; }
.login-form .sub { text-align: center; color: var(--muted); margin-top: -8px; }
.demo-acc { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; }
.copy-line { font-size: 11.5px; color: var(--muted); text-align: center; }

/* ---------- shell ---------- */
.top { background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #f0c48e; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; flex: none; }
.brand b { font-family: var(--f-display); font-size: 19px; color: var(--brand); display: block; line-height: 1.1; }
.brand small { font-size: 10.5px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.greet { flex: 1; min-width: 160px; color: var(--muted); }
.greet b { color: var(--ink); }
.top-cards { display: flex; gap: 8px; flex-wrap: wrap; }
.tcard { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 5px 12px; font-size: 12px; line-height: 1.3; text-align: left; cursor: default; }
.tcard small { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
button.tcard { cursor: pointer; }
button.tcard:hover { border-color: var(--accent); }

.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); display: flex; overflow-x: auto; scrollbar-width: none; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav::-webkit-scrollbar { display: none; }
.nav button { background: none; border: 0; color: #e9d6c0; padding: 12px 14px; font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; border-bottom: 3px solid transparent; letter-spacing: .02em; }
.nav button:hover { color: #fff; }
.nav button.on { color: #fff; border-bottom-color: var(--accent); background: rgba(255,255,255,.07); }
.nav .sp { flex: 1; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }

main { padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
.status { border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 4px; }

/* ---------- common ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.sec { font-size: 17px; color: var(--brand); display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sec::before { content: ""; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }
.sec .r { margin-left: auto; font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.inp { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 10px; min-height: 38px; }
textarea.inp { resize: vertical; min-height: 60px; }
.inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; min-height: 38px; white-space: nowrap; }
.btn:hover { border-color: var(--brand-2); }
.btn:focus-visible, .chip:focus-visible, .nav button:focus-visible, .qbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.pri:hover { background: #ad6322; }
.btn.dark { background: var(--brand); border-color: var(--brand); color: var(--on-dark); }
.btn.good { background: var(--good-soft); border-color: #b9dcc6; color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: #efc3bc; color: var(--bad); }
.btn.info { background: var(--info-soft); border-color: #bcd3ee; color: var(--info); }
.btn.big { padding: 12px 18px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-dark); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 10px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.mute { background: var(--panel-2); color: var(--muted); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--brand); color: var(--on-dark); text-align: left; font-weight: 600; padding: 9px 10px; white-space: nowrap; font-size: 12px; letter-spacing: .02em; }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
tbody tr:nth-child(even) td { background: #fdf7ee; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--accent-soft); }
tbody tr.sel td { background: #f0d3b3 !important; }
td.r, th.r { text-align: right; }
.empty { text-align: center; color: var(--muted); padding: 28px 10px; }
.pager { display: flex; gap: 4px; align-items: center; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pager button { min-width: 32px; min-height: 30px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
.pager button.on { background: var(--brand); color: #fff; border-color: var(--brand); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.kpi .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: #f0c48e; display: grid; place-items: center; flex: none; }
.kpi .ic svg { width: 20px; height: 20px; }
.kpi small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kpi b { display: block; font-size: 21px; font-weight: 700; font-family: var(--f-body); color: var(--ink); font-variant-numeric: tabular-nums; }
.delta { font-size: 11.5px; font-weight: 600; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }

/* POS */
.pos { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(330px, 1fr); gap: 16px; align-items: start; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
.pcard { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
.pcard.in { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pimg { aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; font-size: 46px; border: 0; cursor: pointer; padding: 0; width: 100%; }
.pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pbody { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.pname { font-weight: 700; font-size: 13.5px; }
.pdesc { font-size: 11px; color: var(--muted); line-height: 1.35; flex: 1; }
.pprice { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.qty { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
.qbtn { width: 30px; height: 30px; border-radius: 7px; border: 0; font-size: 17px; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
.qbtn.m { background: var(--bad-soft); color: var(--bad); }
.qbtn.p { background: var(--accent); color: #fff; }
.qty span { font-weight: 700; min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.pos-cart { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 12px 0; font-variant-numeric: tabular-nums; }
.totals .grand { font-family: var(--f-body); font-weight: 800; font-size: 24px; color: var(--accent); font-weight: 700; }
.paybar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.paybar .chip { border-radius: 8px; text-align: center; padding: 8px 4px; }
.mini-q { display: inline-flex; align-items: center; gap: 4px; }
.mini-q button { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 700; line-height: 1; }
.xbtn { border: 0; background: none; color: var(--bad); cursor: pointer; font-size: 16px; padding: 2px 6px; }
.cart-fab { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 6; display: none; }

/* charts */
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .area { fill: var(--accent); fill-opacity: .14; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.chart .pt { fill: var(--panel); stroke: var(--accent); stroke-width: 2; }
.chart .pt.end { fill: var(--accent); }
.chart .lbl { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--f-body); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .tr { background: var(--panel-2); border-radius: 4px; height: 14px; overflow: hidden; }
.bar-row .fl { background: var(--accent); height: 100%; border-radius: 4px; }
.bar-row .v { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.donut { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.donut svg { width: 150px; height: 150px; flex: none; }
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; flex: 1; min-width: 180px; }
.legend div { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }

/* misc list */
.list { display: flex; flex-direction: column; }
.list > div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: center; }
.list > div:first-child { border-top: 0; }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.thumb { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; font-size: 20px; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(30,18,10,.55); display: grid; place-items: center; z-index: 50; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.mbox { background: var(--panel); border-radius: 16px; width: min(100%, 520px); padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); max-height: calc(100vh - 32px); overflow-y: auto; }
.mbox.wide { width: min(100%, 760px); }
.mbox h3 { font-size: 21px; color: var(--brand); }
.mfoot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--brand); color: var(--on-dark); padding: 10px 14px; border-radius: 10px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: min(90vw, 380px); animation: tin .2s ease-out; }
.toast.good { background: var(--good); } .toast.bad { background: var(--bad); } .toast.warn { background: var(--warn); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } }
.qr { display: grid; place-items: center; gap: 6px; text-align: center; }
.qr img { width: 220px; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
.change { font-family: var(--f-body); font-size: 22px; font-weight: 800; }

#printArea { display: none; }
@media print {
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block; color: #000; font: 12px/1.4 var(--f-body); }
  #printArea table th { background: #fff; color: #000; border-bottom: 1px solid #000; }
  #printArea td { border-top: 1px dashed #999; background: #fff !important; }
  .receipt.p58 { width: 48mm; font-size: 10.5px; } .receipt.p80 { width: 72mm; font-size: 12px; } .receipt.pA5 { width: 120mm; font-size: 14px; }
  .receipt { margin: 0 auto; }
  .pbreak { page-break-after: always; break-after: page; }
}
.prn-status { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font-size: 13px; }
.prn-status .dot { margin: 0; }
.prn-status .dot.off { background: var(--muted); }
.kitchen h2 { font-size: 22px; } .kitchen .it { font-size: 16px; font-weight: 700; display: flex; gap: 8px; }
.receipt { width: 300px; margin: 0 auto; }
.receipt h2 { text-align: center; font-size: 20px; }
.receipt .c { text-align: center; }
.receipt hr { border: 0; border-top: 1px dashed #999; margin: 8px 0; }

/* UX bổ sung */
.nav button { display: inline-flex; align-items: center; gap: 7px; }
.nav svg { width: 17px; height: 17px; flex: none; opacity: .9; }
.btn, .chip, .pcard, .nav button, .qbtn { transition: background-color .15s, border-color .15s, box-shadow .15s, transform .1s; }
.btn:active, .qbtn:active, .chip:active { transform: scale(.97); }
.pcard:hover { box-shadow: 0 6px 18px rgba(74,46,27,.12); }
.pimg { position: relative; }
.pbadge { position: absolute; top: 8px; right: 8px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 99px; background: var(--accent); color: #fff; font: 700 13px/26px var(--f-body); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.pdesc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
th { position: sticky; top: 0; z-index: 1; }
tbody tr.low td { background: var(--warn-soft) !important; }
tbody tr.out td { background: var(--bad-soft) !important; }
.held { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; padding: 10px; background: var(--accent-soft); border-radius: 10px; align-items: center; }
.held b { font-size: 12px; color: var(--brand); margin-right: 2px; }
.held .chip { background: #fff; }
.hint { font-size: 11.5px; color: var(--muted); }
.only-sheet { display: none; }
.sheet-bg { position: fixed; inset: 0; background: rgba(30,18,10,.45); z-index: 39; }
.success { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.success .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; }
.success .ok svg { width: 34px; height: 34px; }
.bnav { display: none; }
.more-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

function niceMax(v) { if (v <= 0) return 1; var m = Math.pow(10, Math.floor(Math.log10(v))); var f = [1, 2, 2.5, 5, 10]; for (var i = 0; i < f.length; i++) if (f[i] * m >= v) return f[i] * m; return 10 * m; }

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ doanh thu">' + g + '<path class="area" d="' + area + '"/><path class="ln" d="' + line + '"/>' + dots + lbl + '</svg>';
}

  return '<div class="donut"><svg viewBox="0 0 150 150" role="img" aria-label="Tỷ lệ doanh thu theo hình thức thanh toán"><circle cx="75" cy="75" r="' + R + '" fill="none" stroke="var(--panel-2)" stroke-width="22"/>' + segs +

  var r = val('tcReason'); if (!r) { toast('Nhập lý do hủy.', 'bad'); $('tcReason').focus(); return; }
  var h = heldOf(name); if (!h) return;
  logAct('Hủy bàn ' + name + ' · ' + sum(h.items, function (i) { return i.qty; }) + ' món · ' + money(heldTotal(h)) + ' · Lý do: ' + r);
  S.held = S.held.filter(function (x) { return x !== h; }); save(); closeModal(); renderMain(); toast('Đã hủy đơn ' + name + '.', 'warn');
}
function tableEditor() { tbEdit = S.tables.map(function (t) { return { id: t.id, name: t.name, zone: t.zone, seats: t.seats, old: t.name }; }); renderTbEdit(); }
function renderTbEdit() {
  var zl = []; zones().concat(tbEdit.map(function (t) { return t.zone; })).forEach(function (z) { if (z && zl.indexOf(z) < 0) zl.push(z); });
  modal('<h3>Sửa sơ đồ bàn</h3><p class="tiny muted" style="margin:0">Đặt tên bàn, khu vực (VD: Tầng 1, Tầng 2, Sân vườn) và số chỗ ngồi. Bàn đang có khách không xóa được.</p>' +
    '<datalist id="zoneList">' + zl.map(function (z) { return '<option value="' + esc(z) + '">'; }).join('') + '</datalist>' +
    '<div class="tbl-wrap" style="max-height:45vh"><table><thead><tr><th>Tên bàn</th><th>Khu vực</th><th>Số chỗ</th><th></th></tr></thead><tbody>' +
    tbEdit.map(function (t, i) { return '<tr><td><input class="inp" value="' + esc(t.name) + '" oninput="tbEdit[' + i + '].name=this.value" aria-label="Tên bàn"></td><td><input class="inp" list="zoneList" value="' + esc(t.zone) + '" oninput="tbEdit[' + i + '].zone=this.value" aria-label="Khu vực"></td><td><input class="inp num" type="number" min="1" max="50" style="width:80px" value="' + t.seats + '" oninput="tbEdit[' + i + '].seats=+this.value||1" aria-label="Số chỗ"></td><td>' + (t.old && heldOf(t.old) ? '<span class="pill warn">Có khách</span>' : '<button class="xbtn" onclick="tbEdit.splice(' + i + ',1);renderTbEdit()" aria-label="Xóa bàn">✕</button>') + '</td></tr>'; }).join('') +
    (tbEdit.length ? '' : '<tr><td colspan="4" class="empty">Chưa có bàn. Thêm bàn ở bên dưới.</td></tr>') + '</tbody></table></div>' +
    '<div class="row"><button class="btn" onclick="tbAdd(1)">+ Thêm 1 bàn</button><span class="tiny muted">hoặc thêm nhanh</span><input class="inp num" id="tbN" type="number" min="1" max="50" value="5" style="width:72px" aria-label="Số bàn thêm"><span class="tiny">bàn vào khu</span><input class="inp" id="tbZ" list="zoneList" placeholder="VD: Tầng 2" style="width:150px" aria-label="Khu vực"><button class="btn" onclick="tbAdd(+val(\'tbN\'),val(\'tbZ\'))">Thêm</button></div>' +
    '<div class="mfoot"><span class="tiny muted" style="margin-right:auto;align-self:center">' + tbEdit.length + ' bàn</span><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="tbSave()">Lưu sơ đồ bàn</button></div>', true, null, true);
}
function tbAdd(n, zone) {
  n = Math.max(1, Math.min(50, n || 1)); var z = (zone || '').trim() || (tbEdit.length ? tbEdit[tbEdit.length - 1].zone : 'Trong nhà'), maxN = 0;
  tbEdit.concat(S.tables).forEach(function (t) { var k = parseInt(String(t.name).replace(/\D/g, ''), 10); if (k > maxN) maxN = k; });
  for (var i = 1; i <= n; i++) tbEdit.push({ id: 'T' + Date.now() + '-' + i, name: 'Bàn ' + (maxN + i), zone: z, seats: 4, old: '' });
  renderTbEdit();
}
function tbSave() {
  var seen = {};
  for (var i = 0; i < tbEdit.length; i++) {
    var t = tbEdit[i]; t.name = String(t.name || '').trim(); t.zone = String(t.zone || '').trim() || 'Khu chính';
    if (!t.name) { toast('Có bàn chưa đặt tên.', 'bad'); return; }
    if (norm(t.name) === norm('Mang đi')) { toast('Không đặt tên bàn là "Mang đi".', 'bad'); return; }
    if (seen[norm(t.name)]) { toast('Tên bàn "' + t.name + '" bị trùng.', 'bad'); return; }
    seen[norm(t.name)] = 1;
  }
  var lost = S.held.filter(function (h) { return h.table !== 'Mang đi' && !tbEdit.some(function (t) { return t.old === h.table; }); });
  if (lost.length) { toast('Không thể xóa bàn đang có khách: ' + lost.map(function (h) { return h.table; }).join(', '), 'bad'); return; }
  tbEdit.forEach(function (t) { if (t.old && t.old !== t.name) { S.held.forEach(function (h) { if (h.table === t.old) h.table = t.name; }); if (posTable === t.old) posTable = t.name; } });
  S.tables = tbEdit.map(function (t) { return { id: t.id, name: t.name, zone: t.zone, seats: t.seats || 4 }; }); S.shop.tables = S.tables.length;
  if (zones().indexOf(tbZone) < 0) tbZone = 'Tất cả';
  logAct('Sửa sơ đồ bàn · ' + S.tables.length + ' bàn'); save(); closeModal(); render(); toast('Đã lưu sơ đồ ' + S.tables.length + ' bàn.', 'good');
}

// ---------- LOG ----------
var lgQ = '', lgBy = '', lgPage = 1;
function rLog() {
  var q = norm(lgQ), list = S.logs.filter(function (l) { return (!lgBy || l.by === lgBy) && (!q || norm(l.a).indexOf(q) >= 0); }), size = 20, pg = Math.min(lgPage, Math.max(1, Math.ceil(list.length / size)));
  return '<div class="card"><h2 class="sec">Nhật ký hoạt động<span class="r">Ghi lại thao tác quan trọng: thanh toán, hủy đơn, đổi giá, nhập kho, chấm công</span></h2>' +
    '<div class="fgrid"><div class="field"><label for="lgBy">Nhân viên</label><select class="inp" id="lgBy" onchange="lgBy=this.value;lgPage=1;renderMain()">' + opt([['', 'Tất cả nhân viên']].concat(S.staff.map(function (x) { return [x.id, x.id + ' · ' + x.name]; })), lgBy) + '</select></div>' +
    '<div class="field"><label for="lgQ">Tìm trong nhật ký</label><input class="inp" id="lgQ" value="' + esc(lgQ) + '" placeholder="VD: hủy, giá, nhập kho" onchange="lgQ=this.value;lgPage=1;renderMain()"></div></div>' +
    '<div class="chips" style="margin-top:10px">' + ['Hủy đơn', 'Sửa món', 'Nhập kho', 'Vào ca', 'Đăng nhập'].map(function (k) { return '<button class="chip ' + (lgQ === k ? 'on' : '') + '" onclick="lgQ=lgQ===\'' + k + '\'?\'\':\'' + k + '\';lgPage=1;renderMain()">' + k + '</button>'; }).join('') + '</div>' +
    '<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Thời gian</th><th>Nhân viên</th><th>Thao tác</th></tr></thead><tbody>' +
    (list.length ? list.slice((pg - 1) * size, pg * size).map(function (l) { var bad = /Hủy|Xóa/.test(l.a); return '<tr><td class="num" style="white-space:nowrap">' + vnDate(ymd(new Date(l.t))) + ' ' + vnTime(l.t) + '</td><td>' + esc(staffName(l.by)) + '</td><td>' + (bad ? '<span class="pill bad">Lưu ý</span> ' : '') + esc(l.a) + '</td></tr>'; }).join('')
      : '<tr><td colspan="3" class="empty">Chưa có hoạt động nào. Từ giờ mọi thao tác sẽ được ghi lại ở đây.</td></tr>') + '</tbody></table></div>' + pager(list.length, pg, size, 'lgGo') + '</div>';
}
function lgGo(p) { lgPage = p; renderMain(); }

// ---------- SETTINGS ----------
function rSettings() {
  var sh = S.shop, used = 0; try { used = (localStorage.getItem(KEY) || '').length; } catch (e) {}
  return '<div class="grid2"><div class="card"><h2 class="sec">Thông tin cửa hàng</h2><div class="fgrid">' +
    fld('cfName', 'Tên quán', '<input class="inp" id="cfName" value="' + esc(sh.name) + '">') + fld('cfSlogan', 'Khẩu hiệu', '<input class="inp" id="cfSlogan" value="' + esc(sh.slogan) + '">') +
    fld('cfAddr', 'Địa chỉ', '<input class="inp" id="cfAddr" value="' + esc(sh.address) + '">') + fld('cfPhone', 'Số điện thoại', '<input class="inp" id="cfPhone" value="' + esc(sh.phone) + '">') +
    fld('cfTables', 'Bàn', '<button type="button" class="btn" id="cfTables" onclick="go(\'tables\');tableEditor()">Sửa sơ đồ bàn (' + S.tables.length + ' bàn)</button>') + fld('cfThanks', 'Lời cảm ơn trên hóa đơn', '<input class="inp" id="cfThanks" value="' + esc(sh.thanks) + '">') + fld('cfTarget', 'Mục tiêu doanh thu mỗi ngày (đ)', '<input class="inp num" type="number" inputmode="numeric" min="0" step="100000" id="cfTarget" value="' + (sh.target || 0) + '">') + '</div>' +
    '<h2 class="sec" style="margin-top:18px">Quyền của nhân viên</h2><label class="row" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="cfStaffPrice"' + (sh.staffPrice ? ' checked' : '') + ' style="margin-top:3px"> <span>Cho phép nhân viên sửa giá món<br><span class="tiny muted">Nhân viên thấy nút "Sửa giá" ở trang bán hàng. Mỗi lần đổi giá đều ghi tên người sửa vào Nhật ký.</span></span></label>' +
    '<h2 class="sec" style="margin-top:18px">Tài khoản nhận chuyển khoản (mã QR)</h2><div class="fgrid">' +
    fld('cfBank', 'Ngân hàng', '<select class="inp" id="cfBank">' + opt(BANKS, sh.bankBin) + '</select>') + fld('cfAcc', 'Số tài khoản', '<input class="inp num" id="cfAcc" inputmode="numeric" value="' + esc(sh.bankAcc) + '">') +
    fld('cfHolder', 'Tên chủ tài khoản', '<input class="inp" id="cfHolder" value="' + esc(sh.bankHolder) + '" placeholder="NGUYEN VAN A" style="text-transform:uppercase">') + '</div>' +
    '<p class="tiny muted">Khi khách chọn "Chuyển khoản", phần mềm tạo mã VietQR có sẵn số tiền để khách quét.</p>' +
    '<div class="row" style="margin-top:10px"><button class="btn pri" onclick="saveShop()">Lưu thông tin</button></div></div>' +
    '<div class="stack">' + rCloud() + rPrinter() + '<div class="card"><h2 class="sec">Sao lưu dữ liệu</h2><p class="tiny muted" style="margin:0 0 10px">Dữ liệu lưu ngay trên trình duyệt của thiết bị này (' + Math.round(used / 1024) + ' KB). Nên tải bản sao lưu mỗi tuần, và dùng bản sao lưu để chuyển dữ liệu sang máy khác.</p>' +
    '<div class="row"><button class="btn good" onclick="backup()">Tải bản sao lưu</button><label class="btn info" for="restoreF">Khôi phục từ file</label><input type="file" id="restoreF" accept=".json,application/json" hidden onchange="restore(this)"></div></div>' +
    '<div class="card"><h2 class="sec">Cài đặt lại từ đầu</h2><p class="tiny muted" style="margin:0 0 10px">Xóa toàn bộ dữ liệu trên máy này (nhân viên, đơn hàng, menu, kho) và quay về màn hình thiết lập quán. Hãy tải bản sao lưu trước.</p>' +
    '<div class="row"><button class="btn bad" onclick="resetAll()">Cài đặt lại từ đầu</button></div></div>' +
    '<div class="card"><h2 class="sec">Bản quyền</h2><p style="margin:0">' + esc(APP_NAME) + ' – phần mềm quản lý quán cà phê.<br>© ' + new Date().getFullYear() + ' <b>' + esc(OWNER) + '</b>. Bảo lưu mọi quyền.</p></div></div></div>';
}
function saveShop() {
  Object.assign(S.shop, { name: val('cfName') || 'Quán cà phê', slogan: val('cfSlogan'), address: val('cfAddr'), phone: val('cfPhone'), tables: S.tables.length, thanks: val('cfThanks'), staffPrice: $('cfStaffPrice').checked, target: Math.max(0, +val('cfTarget') || 0), bankBin: val('cfBank'), bankAcc: val('cfAcc').replace(/\s/g, ''), bankHolder: val('cfHolder').toUpperCase() });
  logAct('Cập nhật thông tin cửa hàng'); save(); render(); toast('Đã lưu thông tin cửa hàng.', 'good');
}
function backup() { downloadFile('sao-luu_' + norm(S.shop.name).replace(/[^a-z0-9]+/g, '-') + '_' + today() + '.json', JSON.stringify(S), 'application/json'); toast('Đã tạo file sao lưu.', 'good'); }
function restore(inp) {
  var f = inp.files[0]; if (!f) return; var r = new FileReader();
  r.onload = function () {
    var d; try { d = JSON.parse(r.result); } catch (e) { d = null; }
    if (!d || (d.v !== 1 && d.v !== 2) || !d.staff || !d.products) { toast('File không đúng định dạng sao lưu của phần mềm.', 'bad'); return; }
    confirmBox('Khôi phục dữ liệu?', 'Toàn bộ dữ liệu hiện tại sẽ được thay bằng dữ liệu trong file <b>' + esc(f.name) + '</b>.' + (CLOUDCFG ? ' <b>Máy đang đồng bộ: dữ liệu trong file cũng sẽ được gửi lên máy chủ cho mọi máy.</b>' : ''), function () { d.v = 2; S = d; load2(); save(); me = S.staff.filter(function (s) { return s.id === me.id; })[0] || null; render(); toast('Đã khôi phục dữ liệu.', 'good'); }, 'Khôi phục');
  };
  r.readAsText(f);
}
function clearDemo() { confirmBox('Xóa dữ liệu mẫu?', 'Xóa toàn bộ đơn hàng, lịch trực và lịch sử kho mẫu. Menu, công thức, nguyên liệu và nhân viên được giữ lại.', function () { S.orders = []; S.schedule = []; S.stockLog = []; S.demo = false; save(); render(); toast('Đã xóa dữ liệu mẫu. Sẵn sàng bán hàng!', 'good'); }); }
function resetAll() { confirmBox('Cài đặt lại từ đầu?', 'Toàn bộ dữ liệu trên máy này sẽ bị xóa và không khôi phục được (trừ khi bạn có file sao lưu).' + (CLOUDCFG ? ' Máy này sẽ ngắt đồng bộ, dữ liệu trên máy chủ vẫn giữ nguyên.' : ''), function () { if (CLOUDCFG) cloudDisconnect(true); S = null; me = null; cart = []; try { localStorage.removeItem(KEY); localStorage.removeItem(SKEY); } catch (e) {} render(); }, 'Xóa và cài lại'); }

// ---------- boot ----------
document.addEventListener('keydown', function (e) {
  var tg = e.target.tagName;
  if (e.key === 'Escape') { if ($('modal')) closeModal(); else if (posCartOpen) closeCart(); }
  if (e.key === 'Enter' && _enterFn && tg !== 'TEXTAREA' && tg !== 'BUTTON') { e.preventDefault(); _enterFn(); }
  if (e.key === 'F9' && tab === 'pos' && me && cart.length && !$('modal')) { e.preventDefault(); checkout(); }
  if (e.key === '/' && tab === 'pos' && !$('modal') && tg !== 'INPUT' && tg !== 'TEXTAREA' && tg !== 'SELECT') { e.preventDefault(); $('posQ').focus(); }
});
loadUI(); loadCloudCfg(); load(); parseJoin(); render(); bootCloud();
</script>
</body>
</html>
